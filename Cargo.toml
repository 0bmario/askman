[package]
name = "askman"
version = "0.3.3"
edition = "2024"
description = "A simple, offline CLI tool to help you use Unix, Linux, macOS, and Windows commands more easily."
license = "MIT"
repository = "https://github.com/0bmario/askman"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.37", features = ["derive"] }
colored = "3.0.0"
fastembed = "4.8.0"
dirs = "5.0.1"
reqwest = { version = "0.12", features = ["blocking"] }
rusqlite = { version = "0.35.0", features = ["bundled"] }
sqlite-vec = "0.1.6"
zerocopy = "0.8.25"

# Temporary workaround for Apple Silicon compilation failures on Rust 1.85+
# fastembed -> tokenizers -> image -> zune-jpeg
# See: https://github.com/rust-lang/rust/issues/136894
zune-jpeg = "=0.4.13"
indicatif = "0.18.4"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
libc = "0.2.172"
flate2 = "1.1.1"
tar = "0.4.44"

[[bin]]
name = "askman"
path = "src/main.rs"

[[bin]]
name = "tldr_subset"
path = "src/bin/tldr_subset.rs"
required-features = ["dev"]

[[bin]]
name = "askman_candidate"
path = "src/bin/askman_candidate.rs"
required-features = ["dev"]

[features]
dev = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.19.1"
