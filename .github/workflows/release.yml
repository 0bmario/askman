name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    name: Cross-platform CI
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    permissions:
      contents: read

  release-readiness:
    name: Verify A/B release recommendation
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Require passing release-gate evidence
        run: |
          python scripts/validate_release_gate.py \
            --report docs/reproducibility/artifacts/release-gate.json \
            --expected-candidate-commit "${GITHUB_SHA}"

  build-binaries:
    name: Build Binary (${{ matrix.artifact_name }})
    needs: [ci, release-readiness]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: askman-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: askman-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: askman-macos-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive
        run: |
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C target/${{ matrix.target }}/release askman

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-binaries, release-readiness]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag matches Cargo.toml version
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          with open("Cargo.toml", "rb") as f:
              cargo_version = tomllib.load(f)["package"]["version"]

          expected_tag = f"v{cargo_version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]

          if actual_tag != expected_tag:
              print(
                  f"Tag/version mismatch: pushed tag {actual_tag}, expected {expected_tag} from Cargo.toml",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Tag/version check passed: {actual_tag}")
          PY

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: askman-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksum files
        run: |
          cd release-assets
          for file in askman-*.tar.gz; do
            sha256sum "${file}" > "${file}.sha256"
          done
          cd ..
          sha256sum install.sh > release-assets/install.sh.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release-assets/askman-*.tar.gz
            release-assets/askman-*.tar.gz.sha256
            release-assets/install.sh.sha256
