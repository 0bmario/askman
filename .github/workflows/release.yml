name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Pinned: the binary links the runner's glibc, and ubuntu-latest moved
          # to 26.04 (glibc 2.43), which current LTS distributions cannot load.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: askman-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: askman-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: askman-macos-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check Linux glibc requirement
        if: runner.os == 'Linux'
        run: |
          max_glibc=2.35
          required=$(objdump -T target/${{ matrix.target }}/release/askman \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -n1)
          echo "Binary requires glibc ${required}; maximum allowed is ${max_glibc}"
          if [ "$(printf '%s\n%s\n' "$required" "$max_glibc" | sort -V | tail -n1)" != "$max_glibc" ]; then
            echo "Linux binary needs glibc ${required}, newer than ${max_glibc}" >&2
            exit 1
          fi

      - name: Package release archive
        run: |
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C target/${{ matrix.target }}/release askman

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-binaries]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag matches Cargo.toml version
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          with open("Cargo.toml", "rb") as f:
              cargo_version = tomllib.load(f)["package"]["version"]

          expected_tag = f"v{cargo_version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]

          if actual_tag != expected_tag:
              print(
                  f"Tag/version mismatch: pushed tag {actual_tag}, expected {expected_tag} from Cargo.toml",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Tag/version check passed: {actual_tag}")
          PY

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: askman-*
          merge-multiple: true
          path: release-assets

      # askman 0.3.3 and older download releases/latest/download/commands.db.
      # Newer binaries download their own pinned db-vN release instead.
      - name: Attach commands database for older binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download db-v1 --repo "${GITHUB_REPOSITORY}" --pattern commands.db --dir release-assets
          echo "0218c1fd18dc6eb1c6b405356c92e47379286cec68f9fea1a70be896d5f71495  release-assets/commands.db" | sha256sum -c -

      - name: Generate checksum files
        run: |
          cd release-assets
          for file in askman-*.tar.gz; do
            sha256sum "${file}" > "${file}.sha256"
          done
          cd ..
          sha256sum install.sh > release-assets/install.sh.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release-assets/askman-*.tar.gz
            release-assets/askman-*.tar.gz.sha256
            release-assets/install.sh.sha256
            release-assets/commands.db
