name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Package
        run: cargo package

      - name: Build askman and the eval ranker
        run: cargo build --bin askman --example rank

      # db-v1 and the query model live under this HOME; restored from cache, fetched only on a miss.
      - name: Cache askman data
        id: askman-data
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/askman-home
          key: askman-data-db-v1-AllMiniLML6V2Q-${{ runner.os }}

      - name: Fetch db-v1 and the query model
        if: steps.askman-data.outputs.cache-hit != 'true'
        run: HOME="$RUNNER_TEMP/askman-home" ./target/debug/askman list files

      - name: Offline smoke test
        run: |
          # No network at all: a sandbox profile on macOS, an empty network namespace on Linux.
          if [ "$RUNNER_OS" = macOS ]; then
            offline() { sandbox-exec -p '(version 1)(allow default)(deny network*)' "$@"; }
          else
            offline() { sudo unshare --net --setuid "$(id -u)" --setgid "$(id -g)" "$@"; }
          fi
          for query in "extract a tar archive" "list files in a directory" "find files by name"; do
            answer=$(offline env HOME="$RUNNER_TEMP/askman-home" ./target/debug/askman $query)
            echo "$answer"
            if [ -z "$answer" ] || [ "$answer" = "No good matches found." ]; then
              echo "::error::no answer for '$query'"
              exit 1
            fi
          done

      # Report only: the score is uploaded, never compared against a threshold.
      - name: Eval (dev)
        run: HOME="$RUNNER_TEMP/askman-home" python3 eval/score.py --rank target/debug/examples/rank | tee eval-dev.txt

      - name: Upload eval summary
        uses: actions/upload-artifact@v4
        with:
          name: eval-dev-${{ matrix.os }}
          path: eval-dev.txt
