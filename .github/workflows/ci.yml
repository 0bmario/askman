name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - retrieval-v2
  workflow_dispatch:
    inputs:
      full:
        description: Run the full cross-platform release verification
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: "1"
  LIBONNXRUNTIME_NO_PKG_CONFIG: "1"
  ORT_PREFER_DYNAMIC_LINK: "1"
  ORT_EXPECTED_VERSION: "1.20.0"
  RUST_BACKTRACE: "1"

jobs:
  fast:
    name: Fast checks (ubuntu-latest)
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-build-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-build-v1-

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Provision pinned ONNX Runtime shared runtime
        shell: bash
        run: |
          set -euo pipefail
          python scripts/provision_onnxruntime.py \
            --target x86_64-unknown-linux-gnu \
            --work-dir "$RUNNER_TEMP/askman-onnxruntime" \
            --report "$RUNNER_TEMP/askman-onnxruntime/runtime-provision.json" \
            --github-env "$GITHUB_ENV"

      - name: Fetch locked dependencies (networked setup)
        run: cargo fetch --locked

      - name: Prime native runtime and dev binaries (networked setup)
        run: cargo build --locked --features dev --bin askman --bin tldr_subset --bin askman_candidate

      - name: Check formatting
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked --offline --all-targets --features dev

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate release benchmark freeze
        run: python scripts/validate_evaluation_v2.py --manifest tests/fixtures/evaluation/evaluation-v2-manifest-expanded.json

      - name: Run portable smoke assertions
        shell: bash
        run: bash tests/smoke_offline.sh

  verify:
    name: Verify (${{ matrix.os }})
    if: ${{ inputs.full }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Configure macOS linker header padding
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          printf 'RUSTFLAGS=%s\n' \
            "${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,-headerpad_max_install_names" >> "$GITHUB_ENV"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Provision pinned ONNX Runtime shared runtime
        shell: bash
        run: |
          set -euo pipefail
          python scripts/provision_onnxruntime.py \
            --target '${{ matrix.target }}' \
            --work-dir "$RUNNER_TEMP/askman-onnxruntime" \
            --report "$RUNNER_TEMP/askman-onnxruntime/runtime-provision.json" \
            --github-env "$GITHUB_ENV"

      - name: Cache Rust dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-build-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-build-v1-

      - name: Cache pinned model assets
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/askman-ci-work/model-cache
          key: ${{ runner.os }}-askman-model-${{ hashFiles('src/dense.rs') }}
          restore-keys: |
            ${{ runner.os }}-askman-model-

      - name: Fetch locked dependencies (networked setup)
        run: cargo fetch --locked

      - name: Prime native runtime and dev binaries (networked setup)
        run: cargo build --locked --features dev --bin askman --bin tldr_subset --bin askman_candidate

      - name: Check formatting
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo fmt --all -- --check

      - name: Check all targets
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo check --locked --offline --all-targets --features dev

      - name: Build shipping CLI
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo build --locked --offline --release --bin askman

      - name: Build release-mode lifecycle test CLI
        env:
          CARGO_NET_OFFLINE: "true"
        shell: bash
        run: |
          set -euo pipefail
          shipping_binary="$GITHUB_WORKSPACE/target/release/askman"
          lifecycle_binary="$GITHUB_WORKSPACE/target/release/askman_lifecycle"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            shipping_binary+=".exe"
            lifecycle_binary+=".exe"
          fi
          cp "$shipping_binary" "$shipping_binary.shipping"
          cargo build --locked --offline --release --features dev --bin askman
          cp "$shipping_binary" "$lifecycle_binary"
          cp "$shipping_binary.shipping" "$shipping_binary"
          rm -f "$shipping_binary.shipping"

      - name: Stage pinned Windows runtime beside built binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:ASKMAN_ORT_RUNTIME_ROOT 'lib/onnxruntime.dll'
          $provisionReport = Join-Path $env:RUNNER_TEMP 'askman-onnxruntime/runtime-provision.json'
          if (!(Test-Path -LiteralPath $runtime -PathType Leaf)) {
            throw "provisioned ONNX Runtime DLL is missing: $runtime"
          }
          if (!(Test-Path -LiteralPath $provisionReport -PathType Leaf)) {
            throw "runtime provision report is missing: $provisionReport"
          }
          $expectedSha256 = ((Get-Content -Raw -LiteralPath $provisionReport | ConvertFrom-Json).runtime.library_sha256).ToLowerInvariant()
          $sourceSha256 = (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceSha256 -ne $expectedSha256) {
            throw "provisioned ONNX Runtime DLL digest mismatch: expected=$expectedSha256 actual=$sourceSha256"
          }
          $destinations = @(
            (Join-Path $env:GITHUB_WORKSPACE 'target/debug'),
            (Join-Path $env:GITHUB_WORKSPACE 'target/debug/deps'),
            (Join-Path $env:GITHUB_WORKSPACE 'target/release'),
            (Join-Path $env:GITHUB_WORKSPACE 'target/release/deps')
          )
          foreach ($directory in $destinations) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            $destination = Join-Path $directory 'onnxruntime.dll'
            Copy-Item -LiteralPath $runtime -Destination $destination -Force
            $destinationSha256 = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($destinationSha256 -ne $sourceSha256) {
              throw "staged ONNX Runtime DLL digest mismatch: $destination"
            }
          }

      - name: Embed provisioned runtime path for macOS sandbox
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          runtime_directory="$ASKMAN_ORT_RUNTIME_ROOT/lib"
          test -f "$runtime_directory/libonnxruntime.1.20.0.dylib"
          if ! otool -l "$GITHUB_WORKSPACE/target/release/askman" | grep -F "$runtime_directory" >/dev/null; then
            install_name_tool -add_rpath "$runtime_directory" "$GITHUB_WORKSPACE/target/release/askman"
          fi
          otool -l "$GITHUB_WORKSPACE/target/release/askman" | grep -F "$runtime_directory"
          otool -L "$GITHUB_WORKSPACE/target/release/askman" | grep -F 'libonnxruntime'
          for binary in \
            "$GITHUB_WORKSPACE/target/debug/tldr_subset" \
            "$GITHUB_WORKSPACE/target/debug/askman_candidate" \
            "$GITHUB_WORKSPACE/target/debug/askman" \
            "$GITHUB_WORKSPACE/target/release/askman_lifecycle"; do
            if [[ -x "$binary" ]] && otool -L "$binary" 2>/dev/null | grep -F 'libonnxruntime' >/dev/null; then
              if ! otool -l "$binary" | grep -F "$runtime_directory" >/dev/null; then
                install_name_tool -add_rpath "$runtime_directory" "$binary"
              fi
              otool -l "$binary" | grep -F "$runtime_directory"
            fi
          done
          while IFS= read -r -d '' binary; do
            if otool -L "$binary" 2>/dev/null | grep -F 'libonnxruntime' >/dev/null; then
              if ! otool -l "$binary" | grep -F "$runtime_directory" >/dev/null; then
                install_name_tool -add_rpath "$runtime_directory" "$binary"
              fi
            fi
          done < <(find "$GITHUB_WORKSPACE/target/debug/deps" -type f -perm -111 -print0)

      - name: Run Rust tests and lifecycle coverage
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --locked --offline --all-targets --features dev

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate release benchmark freeze
        run: python scripts/validate_evaluation_v2.py --manifest tests/fixtures/evaluation/evaluation-v2-manifest-expanded.json

      - name: Run portable smoke assertions
        shell: bash
        run: bash tests/smoke_offline.sh

      - name: Provision pinned bundle assets (networked setup)
        run: python scripts/ci_offline.py provision --work-dir "${{ runner.temp }}/askman-ci-work" --report-dir "${{ runner.temp }}/askman-ci-report"

      - name: Exercise clean install and explicit update (local release server)
        shell: bash
        run: |
          set -euo pipefail
          shipping_binary="$GITHUB_WORKSPACE/target/release/askman"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            shipping_binary="$GITHUB_WORKSPACE/target/release/askman_lifecycle.exe"
          else
            shipping_binary="$GITHUB_WORKSPACE/target/release/askman_lifecycle"
          fi
          prepare_command=(
            python scripts/ci_offline.py prepare
            --work-dir "${{ runner.temp }}/askman-ci-work"
            --report-dir "${{ runner.temp }}/askman-ci-report"
            --shipping-binary "$shipping_binary"
            --require-release-binary
          )
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            taskset --cpu-list 0 \
              env OMP_NUM_THREADS=1 \
                timeout --foreground --signal=TERM --kill-after=15s 10m "${prepare_command[@]}"
          else
            "${prepare_command[@]}"
          fi

      - name: Verify bundle and queries with Linux firewall isolation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          timeout --foreground --signal=TERM --kill-after=15s 10m \
            bash -s -- \
              "${{ runner.temp }}/askman-ci-work" \
              "${{ runner.temp }}/askman-ci-report" <<'SCRIPT'
          set -euo pipefail
          work_dir="$1"
          report_dir="$2"
          probe_state="${RUNNER_TEMP}/askman-ci-network-probe.json"
          ipv4_chain="ASKMAN_CI4_${GITHUB_RUN_ID}"
          ipv6_chain="ASKMAN_CI6_${GITHUB_RUN_ID}"
          cleanup() {
            local status=$?
            kill "${probe_pid:-}" 2>/dev/null || true
            wait "${probe_pid:-}" 2>/dev/null || true
            if [[ "${ipv4_inserted:-0}" == 1 ]]; then
              echo '[ci-linux] removing IPv4 firewall rule'
              sudo iptables -w 10 -D OUTPUT -j "$ipv4_chain" || status=1
              sudo iptables -w 10 -F "$ipv4_chain" || status=1
              sudo iptables -w 10 -X "$ipv4_chain" || status=1
            fi
            if [[ "${ipv6_inserted:-0}" == 1 ]]; then
              echo '[ci-linux] removing IPv6 firewall rule'
              sudo ip6tables -w 10 -D OUTPUT -j "$ipv6_chain" || status=1
              sudo ip6tables -w 10 -F "$ipv6_chain" || status=1
              sudo ip6tables -w 10 -X "$ipv6_chain" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          ipv4_inserted=0
          ipv6_inserted=0
          python scripts/network_probe.py server --state "$probe_state" &
          probe_pid=$!
          for _ in {1..50}; do [[ -f "$probe_state" ]] && break; sleep 0.1; done
          test -f "$probe_state"
          kill -0 "$probe_pid"
          probe_url="http://$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print("{}:{}".format(p["host"],p["port"]))' "$probe_state")"
          echo '[ci-linux] acquiring IPv4 xtables lock'
          sudo iptables -w 10 -N "$ipv4_chain"
          ipv4_inserted=1
          sudo iptables -w 10 -A "$ipv4_chain" -j REJECT
          sudo iptables -w 10 -I OUTPUT 1 -j "$ipv4_chain"
          echo '[ci-linux] acquiring IPv6 xtables lock'
          sudo ip6tables -w 10 -N "$ipv6_chain"
          ipv6_inserted=1
          sudo ip6tables -w 10 -A "$ipv6_chain" -j REJECT
          sudo ip6tables -w 10 -I OUTPUT 1 -j "$ipv6_chain"
          sudo iptables -w 10 -C OUTPUT -j "$ipv4_chain"
          sudo ip6tables -w 10 -C OUTPUT -j "$ipv6_chain"
          set +e
          python scripts/network_probe.py request --url "$probe_url"
          probe_status=$?
          set -e
          test "$probe_status" -ne 0
          python scripts/network_probe.py assert-denied --state "$probe_state"
          echo '[ci-linux] firewall isolation active'
          taskset --cpu-list 0 \
            env OMP_NUM_THREADS=1 \
              ASKMAN_CI_NETWORK_POLICY='Linux iptables deny all outbound' \
              ASKMAN_CI_NETWORK_PROBE_STATE="$probe_state" \
              python scripts/ci_offline.py verify \
                --work-dir "$work_dir" \
                --report-dir "$report_dir" \
                --shipping-binary "$GITHUB_WORKSPACE/target/release/askman" \
                --require-release-binary
          SCRIPT

      - name: Verify bundle and queries with macOS network isolation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          command -v sandbox-exec >/dev/null
          test -x "$GITHUB_WORKSPACE/target/release/askman"
          probe_state="$RUNNER_TEMP/askman-ci-network-probe.json"
          python scripts/network_probe.py server --state "$probe_state" &
          probe_pid=$!
          cleanup() { local status=$?; kill "$probe_pid" 2>/dev/null || true; wait "$probe_pid" 2>/dev/null || true; exit "$status"; }
          trap cleanup EXIT
          for _ in {1..50}; do [[ -f "$probe_state" ]] && break; sleep 0.1; done
          test -f "$probe_state"
          kill -0 "$probe_pid"
          probe_url="http://$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print("{}:{}".format(p["host"],p["port"]))' "$probe_state")"
          set +e
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python scripts/network_probe.py request --url "$probe_url"
          probe_status=$?
          set -e
          test "$probe_status" -ne 0
          python scripts/network_probe.py assert-denied --state "$probe_state"
          ASKMAN_CI_NETWORK_POLICY='macOS sandbox-exec deny network*' \
            ASKMAN_CI_NETWORK_PROBE_STATE="$probe_state" \
            sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python scripts/ci_offline.py verify \
              --work-dir "${{ runner.temp }}/askman-ci-work" \
              --report-dir "${{ runner.temp }}/askman-ci-report" \
              --shipping-binary "$GITHUB_WORKSPACE/target/release/askman" \
              --require-release-binary

      - name: Verify bundle and queries on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:GITHUB_WORKSPACE 'target/release/askman.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "production shipping binary is missing: $binary"
          }
          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop | Select-Object -First 1
          if ($null -eq $pythonCommand -or -not $pythonCommand.Source) { throw 'Python application was not resolved' }
          $python = $pythonCommand.Source
          $probeScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/network_probe.py'
          $offlineScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci_offline.py'
          $externalUrl = 'https://github.com/'
          & $python $probeScript request --url $externalUrl --timeout 10
          $baselineExitCode = $LASTEXITCODE
          if ($baselineExitCode -ne 0) {
            throw "external network baseline failed with exit code $baselineExitCode"
          }
          $ruleName = "askman-ci-outbound-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $probeRuleName = "askman-ci-probe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $probeState = Join-Path $env:RUNNER_TEMP 'askman-ci-network-probe.json'
          $probeNonce = [guid]::NewGuid().ToString('D')
          $failure = $null
          function Assert-FirewallRule {
            param([string]$DisplayName, [string]$ExpectedProgram)
            $rules = @(Get-NetFirewallRule -DisplayName $DisplayName -ErrorAction Stop)
            if ($rules.Count -ne 1) { throw "Windows firewall rule is not unique: $DisplayName" }
            $rule = $rules[0]
            if ([string]$rule.Direction -ne 'Outbound' -or [string]$rule.Action -ne 'Block' -or [string]$rule.Enabled -ne 'True') {
              throw "Windows firewall rule has unexpected action, direction, or enabled state: $DisplayName"
            }
            $filters = @(Get-NetFirewallApplicationFilter -AssociatedNetFirewallRule $rule -ErrorAction Stop)
            if ($filters.Count -ne 1 -or [string]$filters[0].Program -ine $ExpectedProgram) {
              throw "Windows firewall rule does not target the exact program path: $DisplayName"
            }
          }
          function Remove-FirewallRuleStrict {
            param([string]$DisplayName)
            $errors = @()
            try {
              Remove-NetFirewallRule -DisplayName $DisplayName -ErrorAction Stop | Out-Null
            } catch {
              $errors += "remove $DisplayName failed: $($_.Exception.Message)"
            }
            try {
              $remaining = @(Get-NetFirewallRule -ErrorAction Stop | Where-Object { $_.DisplayName -eq $DisplayName })
              if ($remaining.Count -ne 0) {
                $errors += "rule remains after removal: $DisplayName"
              }
            } catch {
              $errors += "verify removal of $DisplayName failed: $($_.Exception.Message)"
            }
            return $errors
          }
          try {
            New-NetFirewallRule -DisplayName $ruleName -Direction Outbound -Program $binary -Action Block -Profile Any -Enabled True -ErrorAction Stop | Out-Null
            New-NetFirewallRule -DisplayName $probeRuleName -Direction Outbound -Program $python -Action Block -Profile Any -Enabled True -ErrorAction Stop | Out-Null
            Assert-FirewallRule -DisplayName $ruleName -ExpectedProgram $binary
            Assert-FirewallRule -DisplayName $probeRuleName -ExpectedProgram $python
            if (Test-Path -LiteralPath $probeState) { Remove-Item -LiteralPath $probeState -Force -ErrorAction Stop }
            & $python $probeScript request --url $externalUrl --timeout 10 --state $probeState --baseline-succeeded --nonce $probeNonce
            $blockedExitCode = $LASTEXITCODE
            if ($blockedExitCode -eq 0) { throw "external network probe unexpectedly connected" }
            & $python $probeScript assert-denied --state $probeState --expected-url $externalUrl --expected-nonce $probeNonce
            if ($LASTEXITCODE -ne 0) { throw "external network probe state was not denied" }
            $env:ASKMAN_CI_NETWORK_POLICY = "Windows program-specific outbound firewall: $binary"
            $env:ASKMAN_CI_NETWORK_PROBE_STATE = $probeState
            $env:ASKMAN_CI_NETWORK_PROBE_NONCE = $probeNonce
            & $python $offlineScript verify --work-dir "${{ runner.temp }}/askman-ci-work" --report-dir "${{ runner.temp }}/askman-ci-report" --shipping-binary $binary --require-release-binary
            if ($LASTEXITCODE -ne 0) { throw "offline verification failed with exit code $LASTEXITCODE" }
          } catch {
            $failure = $_
          } finally {
            $cleanupFailures = @()
            $cleanupFailures += Remove-FirewallRuleStrict -DisplayName $probeRuleName
            $cleanupFailures += Remove-FirewallRuleStrict -DisplayName $ruleName
            if ($cleanupFailures.Count -ne 0) {
              $cleanupFailure = "Windows firewall cleanup failed: $($cleanupFailures -join '; ')"
              if ($null -eq $failure) {
                $failure = $cleanupFailure
              } else {
                $failure = "$failure`n$cleanupFailure"
              }
            }
          }
          if ($null -ne $failure) { throw $failure }

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: askman-ci-${{ matrix.os }}
          path: ${{ runner.temp }}/askman-ci-report
          if-no-files-found: warn
